<!doctype html>\n<html lang="ko">\n<head>\n  <meta charset="UTF-8" />\n  <meta name="viewport" content="width=device-width,initial-scale=1" />\n  <title>Video Core Standalone SDK Playground</title>\n  <script type="importmap">\n  {\n    "imports": {\n      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",\n      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",\n      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"\n    }\n  }\n  </script>\n  <style>\n    body{font-family:system-ui,sans-serif;margin:0;background:#0d1720;color:#edf6fb}\n    main{max-width:980px;margin:auto;padding:24px}\n    .card{background:#16232e;border:1px solid #294052;border-radius:16px;padding:20px;margin:16px 0}\n    button{padding:12px 16px;margin:6px;border:0;border-radius:10px;cursor:pointer}\n    video{width:100%;max-height:65vh;background:#000;border-radius:12px;object-fit:contain}\n    code{white-space:pre-wrap;word-break:break-all}\n    .status{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}\n    .status div{background:#0d1720;padding:12px;border-radius:10px}\n    .error{color:#ffb4b4}\n  </style>\n</head>\n<body>\n<main>\n  <h1>Video Core Standalone SDK Playground</h1>\n  <p>React 내부 코드를 직접 쓰지 않고 배포된 <code>/sdk/video-core.esm.js</code>만 불러서 테스트합니다.</p>\n  <section class="card">\n    <div class="status">\n      <div>SDK <strong id="version">-</strong></div>\n      <div>Mode <strong id="mode">-</strong></div>\n      <div>FPS <strong id="fps">-</strong></div>\n      <div>SDK URL <code id="sdk-url"></code></div>\n    </div>\n    <p>\n      <button id="mask">가면 시작</button>\n      <button id="original">원본 시작</button>\n      <button id="stop">종료</button>\n      <a href="/advanced" style="color:#9ed7ff;margin-left:12px">고급 진단</a>\n    </p>\n    <video id="preview" autoplay playsinline muted></video>\n    <p id="error" class="error"></p>\n  </section>\n</main>\n<script type="module">\nconst sdkUrl = new URL("/sdk/video-core.esm.js", location.origin).href;\ndocument.querySelector("#sdk-url").textContent = sdkUrl;\nconst sdk = await import(sdkUrl);\ndocument.querySelector("#version").textContent = sdk.VIDEO_CORE_SDK_VERSION;\nconst core = await sdk.VideoCore.create();\nlet session = null;\nlet timer = null;\nasync function start(mode) {\n  document.querySelector("#error").textContent = "";\n  try {\n    if (session) session.stop();\n    session = await core.openCamera({ mode: mode });\n    document.querySelector("#preview").srcObject = session.stream;\n    document.querySelector("#mode").textContent = mode;\n    clearInterval(timer);\n    timer = setInterval(function () {\n      const status = session && session.getTrackingStatus();\n      document.querySelector("#fps").textContent = status ? status.fps.toFixed(1) : "-";\n    }, 250);\n  } catch (error) {\n    document.querySelector("#error").textContent = error instanceof Error ? error.message : String(error);\n  }\n}\ndocument.querySelector("#mask").addEventListener("click", function () { start("mask"); });\ndocument.querySelector("#original").addEventListener("click", function () { start("original"); });\ndocument.querySelector("#stop").addEventListener("click", function () {\n  if (session) session.stop();\n  session = null;\n  clearInterval(timer);\n  document.querySelector("#preview").srcObject = null;\n  document.querySelector("#mode").textContent = "-";\n  document.querySelector("#fps").textContent = "-";\n});\n</script>\n</body>\n</html>\n
